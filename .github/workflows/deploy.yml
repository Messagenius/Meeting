name: Build and Deploy Jitsi Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  DOCKER_IMAGE: sanketnawale/meetings-web
  IMAGE_TAG: v2.${{ github.run_number }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:latest
          cache-to: type=inline

      - name: 📦 Image built
        run: |
          echo "✅ Image pushed: ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}"
          echo "✅ Image pushed: ${{ env.DOCKER_IMAGE }}:latest"

      - name: 🚀 Deploy to Hetzner K8s
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "🔄 Updating image to ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}"
            microk8s kubectl set image deployment/jitsi web=${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }} -n jitsi
            echo "⏳ Waiting for rollout..."
            microk8s kubectl rollout status deployment/jitsi -n jitsi --timeout=300s
            echo "✅ Deployment complete!"
            microk8s kubectl get pods -n jitsi
      - name: ✅ Deployment Status
        run: echo "🎉 Jitsi deployed successfully to http://${{ secrets.HETZNER_HOST }}:30080"
